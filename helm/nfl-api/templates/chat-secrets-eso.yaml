apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.webapp.name }}-chat-secrets-eso
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: SecretStore
  target:
    name: {{ .Values.webapp.secrets.targetSecret }}
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.webapp.secrets.path }}
        property: {{ .Values.webapp.secrets.anthropicKeyProperty }}
