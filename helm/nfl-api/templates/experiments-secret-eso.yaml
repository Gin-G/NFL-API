# The token POST /experiments/run checks. Its own ExternalSecret on purpose:
# until the property exists in OpenBao this one fails to sync, and only the
# experiments endpoint notices (EXPERIMENT_TOKEN is optional on the webapp).
# Put a long random string at <secretPath>.<tokenProperty> to turn it on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.webapp.name }}-experiments-eso
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: SecretStore
  target:
    name: {{ .Values.webapp.name }}-experiments
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.experiments.secretPath }}
        property: {{ .Values.experiments.tokenProperty }}
