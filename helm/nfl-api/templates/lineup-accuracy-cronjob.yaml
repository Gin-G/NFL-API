# Prospective lineup scoring.
#
# Scores the lineups in `lineup_entries` — the ones the optimizer actually
# built, before kickoff — against the results in `player_stats`, and records
# the two baselines that make a lineup score mean anything: what FanDuel's own
# FPPG would have built from the same pool under the same cap, and the best
# lineup the slate held in hindsight. Read back via GET /optimizer/performance.
#
# A different claim from projection accuracy. The optimizer reads only the
# ORDER of the projections, so the board can be right about a lineup while
# being wrong about every point in it — and the FPPG baseline is the one number
# that says whether the model earned its keep, since FPPG is free and already
# on the slate.
#
# In the CHART rather than in k8s/ (where the projection-accuracy cronjob
# lives) so it deploys itself on sync, like the db-loader, instead of waiting
# on a kubectl apply.
#
# Needs nflverse team stats, because defenses are not in `player_stats`. That
# is a network read and it soft-fails: lineups holding a defense stay partial,
# the build is not frozen, and the next run finishes it.
#
# Runs DAILY, 20 minutes after the projection scoring, for the same reason that
# one runs daily: it only touches weeks whose actuals have landed, never
# rewrites a frozen build, and so picks each week up as the stats arrive.
#
# One-off / backfill run:
#   kubectl create job -n {{ .Release.Namespace }} --from=cronjob/{{ .Values.webapp.name }}-lineup-accuracy lineups-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.webapp.name }}-lineup-accuracy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  schedule: "20 12 * * *"         # daily 12:20 UTC — after the projection scoring
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: {{ .Values.webapp.name }}-lineup-accuracy
        spec:
          restartPolicy: OnFailure
          containers:
            - name: lineup-accuracy
              image: {{ .Values.webapp.container.image }}
              imagePullPolicy: {{ .Values.webapp.container.imagePullPolicy }}
              command: ["python", "-m", "scripts.score_lineups"]
              workingDir: /app
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.db.appUserSecret }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.db.appUserSecret }}
                      key: password
                - name: DATABASE_URL
                  value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@nfl-api-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/nfl-api-db"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
