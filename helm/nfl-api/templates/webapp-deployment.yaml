apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
    spec:
      # Carries the Role that lets POST /projections/refresh start the
      # projections job (templates/projections-rbac.yaml).
      serviceAccountName: {{ .Values.webapp.name }}
      containers:
      - name: {{ .Values.webapp.name }}
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: {{ .Values.webapp.container.imagePullPolicy }}
        resources:
          requests:
            memory: {{ .Values.webapp.container.memoryRequest }}
            cpu: {{ .Values.webapp.container.cpuRequest }}
          limits:
            memory: {{ .Values.webapp.container.memoryLimit }}
            cpu: {{ .Values.webapp.container.cpuLimit }}
        {{- if .Values.webapp.container.env }}
        env:
        {{- range .Values.webapp.container.env }}
        - name: {{ .name }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .secretName }}
              key: {{ .secretKey }}
              optional: true
          {{- end }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        # The experiments token as a file: a mounted secret is updated in place
        # when OpenBao rotates it, where an env var is fixed at pod start (and
        # is absent for good if the secret appeared after the pod did, which is
        # exactly how the first POST /experiments/run was refused).
        volumeMounts:
        - name: experiments-token
          mountPath: /var/run/secrets/experiments
          readOnly: true
      volumes:
      - name: experiments-token
        secret:
          secretName: {{ .Values.webapp.name }}-experiments
          optional: true
