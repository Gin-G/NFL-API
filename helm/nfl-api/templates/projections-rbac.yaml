# Lets the API start the projections job — and nothing else.
#
# The API image has no TensorFlow, so POST /projections/refresh cannot compute a
# projection in-process; it asks Kubernetes to run the same job the CronJob runs
# (app/api/k8s_jobs.py). That needs exactly two verbs: read that CronJob's
# template, and create a Job from it in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.webapp.name }}-projections-trigger
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.webapp.name }}-projections-trigger
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.webapp.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.webapp.name }}-projections-trigger
  apiGroup: rbac.authorization.k8s.io
