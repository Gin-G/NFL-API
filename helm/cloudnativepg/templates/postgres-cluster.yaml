apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.db.name }}
    group: {{ .Values.db.group }}
spec:
  instances: {{ .Values.db.instances }}
  storage:
    size: {{ .Values.db.size }}
    {{- with .Values.db.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.db.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with .Values.db.parameters }}
  postgresql:
    parameters:
{{ toYaml . | indent 6 }}
  {{- end }}

  # Enable superuser access
  enableSuperuserAccess: true
  
  # Configure postgres superuser from su_external_secret
  superuserSecret:
    name: {{ .Values.db.name }}-superuser

  # Create a standard user from user_external_secret
  bootstrap:
    initdb:
      database: {{ .Values.db.app.name }}
      owner: {{ .Values.db.app.owner }}
      secret:
        name: {{ .Values.db.name }}-app-user