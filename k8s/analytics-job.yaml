# Standalone coaching analytics pre-computation job.
#
# Computes breakdown analytics for all coach+team+season combinations and
# caches results in coach_season_analytics. Processes newest seasons first.
# Progress is tracked in analytics_job_status and exposed via:
#   GET /coaches/analytics/status
#
# This Job is NOT managed by ArgoCD / Helm. Apply and delete manually:
#   kubectl apply  -f k8s/analytics-job.yaml -n nfl-api
#   kubectl delete -f k8s/analytics-job.yaml -n nfl-api   # after completion
#
# Monitor progress:
#   kubectl logs -n nfl-api -l app=nfl-api-analytics -f
#   curl https://nfl-api.nickknows.net/coaches/analytics/status | jq .
#
# Run only recent seasons (faster):
#   Patch the command: ["python", "-m", "scripts.compute_analytics", "--end-season", "2020"]
#
# Force recompute everything:
#   Patch the command: ["python", "-m", "scripts.compute_analytics", "--force"]
#
apiVersion: batch/v1
kind: Job
metadata:
  name: nfl-api-compute-analytics
  namespace: nfl-api
  labels:
    app: nfl-api-analytics
spec:
  # Do not retry automatically — run manually when needed
  backoffLimit: 0
  # Keep job visible after completion for log inspection; delete manually
  ttlSecondsAfterFinished: 86400   # auto-clean after 24 h
  template:
    metadata:
      labels:
        app: nfl-api-analytics
    spec:
      restartPolicy: Never
      # No nodeSelector: gingmachine sits at its pod cap, so pin-scheduling
      # leaves the pod Pending. Postgres does the heavy PBP aggregation, so the
      # job pod itself is light and can run on any node (matches the projections
      # cronjob fix in 48574f7).
      containers:
        - name: analytics
          # Always pull the current production image
          image: docker.io/ncging/nfl-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "scripts.compute_analytics"]
          workingDir: /app
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nfl-api-db-app-user
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nfl-api-db-app-user
                  key: password
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@nfl-api-db-rw.nfl-api.svc.cluster.local:5432/nfl-api-db"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
