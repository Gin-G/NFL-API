# Nightly roster sync.
#
# nflverse's weekly rosters once a season is under way — official, already in the
# image, no scraping — and ESPN's live API only while nflverse has nothing for the
# new year, which is the reason this job was ESPN-only to begin with. Depth rank
# comes from nflverse's latest depth-chart snapshot. Populates `current_roster`
# (`source` says which upstream), served via GET /rosters/{team}.
#
# Uses only nflreadpy (already in the API image) + stdlib — no nfl_projections/TF, so
# no runtime pip install.
#
# One-off run:  kubectl create job -n nfl-api --from=cronjob/nfl-api-roster-sync roster-sync-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nfl-api-roster-sync
  namespace: nfl-api
  labels:
    app: nfl-api-roster-sync
spec:
  schedule: "0 8 * * *"          # daily 08:00, cluster local time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      # 1 h: the sync itself takes seconds, so this only fires for a pod the
      # scheduler cannot place. concurrencyPolicy Forbid means one stuck job
      # blocks every night after it — one sat Pending for 26 hours in September.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: nfl-api-roster-sync
        spec:
          restartPolicy: Never
          containers:
            - name: roster-sync
              image: docker.io/ncging/nfl-api:latest
              imagePullPolicy: Always
              workingDir: /app
              command: ["python", "-m", "scripts.sync_rosters"]
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: password
                - name: DATABASE_URL
                  value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@nfl-api-db-rw.nfl-api.svc.cluster.local:5432/nfl-api-db"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1536Mi"
                  cpu: "1"
