# Prospective lineup scoring.
#
# Scores the lineups in `lineup_entries` — the ones the optimizer actually
# built, before kickoff — against the results in `player_stats`, and records
# the two baselines that make a lineup score mean anything: what FanDuel's own
# FPPG would have built from the same pool under the same cap, and the best
# lineup the slate held in hindsight. Served via GET /optimizer/performance.
#
# This is a different claim from projection accuracy. The optimizer reads only
# the ORDER of the projections, so the board can be right about a lineup while
# being wrong about every point in it — and the FPPG baseline is the one number
# that says whether the model earned its keep, since FPPG is free and already
# on the slate.
#
# Needs nflverse team stats (defenses are not in `player_stats`), which is a
# network read. It soft-fails: lineups holding a defense stay partial, the
# build is not frozen, and the next run finishes it.
#
# Runs DAILY, 20 minutes after the projection scoring, for the same reason that
# one does: it only touches weeks whose actuals have landed, never rewrites a
# frozen build, and so picks each week up as soon as the stats arrive.
#
# One-off / backfill run:
#   kubectl create job -n nfl-api --from=cronjob/nfl-api-lineup-accuracy lineups-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nfl-api-lineup-accuracy
  namespace: nfl-api
  labels:
    app: nfl-api-lineup-accuracy
spec:
  schedule: "20 12 * * *"        # daily 12:20 UTC — after the projection scoring
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: nfl-api-lineup-accuracy
        spec:
          restartPolicy: Never
          containers:
            - name: lineup-accuracy
              image: docker.io/ncging/nfl-api:latest
              imagePullPolicy: Always
              workingDir: /app
              command: ["python", "-m", "scripts.score_lineups"]
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: password
                - name: DATABASE_URL
                  value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@nfl-api-db-rw.nfl-api.svc.cluster.local:5432/nfl-api-db"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
