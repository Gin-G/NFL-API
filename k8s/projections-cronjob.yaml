# Weekly fantasy-projections pre-computation.
#
# Builds the dataset from nflreadpy, trains the model (mean + quantile
# floor/ceiling) via the nfl_projections package, and caches results in the
# player_projections table. Progress is tracked in analytics_job_status and
# exposed via GET /projections/status; results via GET /projections?week=N.
#
# The mean model is a 5-seed ensemble (nfl_projections default), so training
# takes ~5x a single network — worth ~0.04 MAE and no seed lottery. Pass
# --seeds 1 in the command below for a fast one-off run.
#
# The API image does NOT bundle nfl_projections (it drags in TensorFlow), so
# this job pip-installs it at runtime. Runs weekly; trigger a one-off run with:
#   kubectl create job -n nfl-api --from=cronjob/nfl-api-projections proj-manual
#
# Manual run for a specific week — patch the command args:
#   ["...", "python", "-m", "scripts.compute_projections", "--week", "3"]
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nfl-api-projections
  namespace: nfl-api
  labels:
    app: nfl-api-projections
spec:
  # Wednesday 09:00 UTC — after Tuesday injury reports, before the weekend slate
  schedule: "0 9 * * 3"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800   # clean up after 48 h
      template:
        metadata:
          labels:
            app: nfl-api-projections
        spec:
          restartPolicy: Never
          # No nodeSelector: with ceph storage the job is node-independent, so let
          # the scheduler pick a node with memory + pod headroom (gingmachine is at
          # its pod cap; gingworker is memory-constrained).
          containers:
            - name: projections
              image: docker.io/ncging/nfl-api:latest
              imagePullPolicy: Always
              workingDir: /app
              command:
                - /bin/sh
                - -c
                # Install from a tarball URL (the API image has no `git`, so a
                # git+https:// URL would fail). pip builds the package from the
                # repo's pyproject.toml.
                - >-
                  pip install --no-cache-dir
                  "nfl-projections @ https://github.com/Gin-G/nfl-data-py/archive/refs/heads/main.tar.gz"
                  && python -m scripts.compute_projections
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nfl-api-db-app-user
                      key: password
                - name: DATABASE_URL
                  value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@nfl-api-db-rw.nfl-api.svc.cluster.local:5432/nfl-api-db"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "1"
                limits:
                  memory: "8Gi"
                  cpu: "3"
