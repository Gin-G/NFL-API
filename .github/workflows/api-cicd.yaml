# Runs tests, builds and pushes a container image for FastAPI, updates the Helm
# chart, triggers an ArgoCD sync so changes go live, then smoke-tests all
# endpoints against the running deployment.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME   - DockerHub login
#   DOCKERHUB_TOKEN      - DockerHub access token
#   ARGOCD_SERVER        - ArgoCD base URL, e.g. https://argocd.nickknows.net
#   ARGOCD_APP_NAME      - ArgoCD application name, e.g. nfl-api
#   ARGOCD_TOKEN         - ArgoCD API token (Settings → Accounts → Generate Token)
#
# The live API URL is derived automatically from helm/nfl-api/values.yaml (fqdn field).

name: NFL API CI/CD

on:
  push:
    paths:
      - app/**
      - frontend/**
      - .github/workflows/**
  workflow_dispatch:

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: app
        run: pip install --quiet -r requirements.txt

      - name: Run tests
        working-directory: app
        run: python -m pytest tests/ -v --tb=short

  # ── 2. Build, push image, update Helm, deploy ─────────────────────────────
  build-and-deploy:
    name: Build, Push & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build and push NFL API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ncging/nfl-api:latest
            ncging/nfl-api:${{ steps.date.outputs.date }}

      - name: Update Helm chart with new image
        run: |
          sed -i "s|image: docker.io/ncging/nfl-api:.*|image: docker.io/ncging/nfl-api:${{ steps.date.outputs.date }}|" \
            helm/nfl-api/values.yaml

      - name: Push Helm chart changes to GitHub
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"
          git commit -a -m "ci: update image to ncging/nfl-api:${{ steps.date.outputs.date }}"
          git pull --rebase
          git push

      - name: Trigger ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_APP_NAME: ${{ secrets.ARGOCD_APP_NAME }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          SERVER="$(echo -n "${ARGOCD_SERVER}" | tr -d '[:space:]')"
          SERVER="${SERVER%/}"
          HTTP=$(curl --silent --show-error -o /dev/null -w "%{http_code}" \
            -X POST \
            "${SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
            -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"prune": true}')
          echo "ArgoCD sync response: $HTTP"
          # 200 = sync started; 400 = already syncing / no diff — both acceptable
          [ "$HTTP" = "200" ] || [ "$HTTP" = "400" ] || { echo "Unexpected ArgoCD response: $HTTP"; exit 1; }

  # ── 3. Wait for ArgoCD rollout ─────────────────────────────────────────────
  # Isolated in its own job so that the ARGOCD_APP_NAME secret value ("nfl-api")
  # is only registered for masking on THIS runner, not on the smoke-test runner.
  wait-for-argo:
    name: Wait for ArgoCD Rollout
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ArgoCD — Synced + Healthy
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_APP_NAME: ${{ secrets.ARGOCD_APP_NAME }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          SERVER="$(echo -n "${ARGOCD_SERVER}" | tr -d '[:space:]')"
          SERVER="${SERVER%/}"
          echo "Giving ArgoCD 15 s to start the rollout..."
          sleep 15
          echo "Polling ArgoCD for Synced/Healthy (max 10 min)..."
          STATUS="unknown/unknown"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf \
              -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
              "${SERVER}/api/v1/applications/${ARGOCD_APP_NAME}" \
              | jq -r '(.status.sync.status) + "/" + (.status.health.status)' 2>/dev/null \
              || echo "unknown/unknown")
            echo "  [$i/60] $STATUS"
            [ "$STATUS" = "Synced/Healthy" ] && { echo "App is live!"; break; }
            sleep 10
          done
          if [ "$STATUS" != "Synced/Healthy" ]; then
            echo "ERROR: App did not reach Synced/Healthy within 10 minutes"
            echo "--- All resource statuses ---"
            curl -sf \
              -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
              "${SERVER}/api/v1/applications/${ARGOCD_APP_NAME}" \
              | jq '{
                  syncStatus: .status.sync.status,
                  syncRevision: .status.sync.revision,
                  operationState: .status.operationState.phase,
                  operationMessage: .status.operationState.message,
                  resources: [.status.resources[] | {kind, name, status, health: .health.status}]
                }' \
              || echo "(could not fetch app status)"
            exit 1
          fi
          echo "Giving the ingress/load-balancer 20 s to finish routing to the new pod..."
          sleep 20

  # ── 4. Smoke-test every live endpoint ──────────────────────────────────────
  # This job intentionally references NO secrets. Because each GitHub-hosted job
  # runs on a fresh runner that only receives secrets explicitly used in that job,
  # ARGOCD_APP_NAME ("nfl-api") is never registered for masking here — so
  # ${{ vars.API_URL }} (https://nfl-api.nickknows.net) is never redacted.
  smoke-test:
    name: Smoke-Test Live API
    needs: wait-for-argo
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API to be fully ready
        run: |
          echo "curl: $(curl --version | head -1)"
          echo "Polling ${{ vars.API_URL }}/ until status == running (max 60 s)..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf --max-time 10 "${{ vars.API_URL }}/" 2>/dev/null \
              | jq -r '.status' 2>/dev/null || echo "")
            if [ "$STATUS" = "running" ]; then
              echo "API is ready (attempt $i)"
              exit 0
            fi
            echo "  [$i/12] status='$STATUS' — retrying in 5 s..."
            sleep 5
          done
          echo "ERROR: API did not return status=running within 60 s"
          curl -v --max-time 10 "${{ vars.API_URL }}/" || true
          exit 1

      - name: GET / — root
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/" \
            | jq -e '.status == "running"'

      - name: GET /health
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/health" \
            | jq -e '.status == "healthy"'

      - name: GET /teams/ — list
        run: |
          TOTAL=$(curl -sf --max-time 30 "${{ vars.API_URL }}/teams/" \
            | jq '.total_teams // 0')
          echo "Total teams: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /teams/KC — detail
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/teams/KC" \
            | jq -e '.data.team_abbr == "KC"'

      - name: GET /schedules/?season=2024&week=1
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/schedules/?season=2024&week=1" \
            | jq '.total_games // 0')
          echo "Games (2024 wk 1): $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/rosters?season=2024&team=KC
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/rosters?season=2024&team=KC" \
            | jq '.total_players // 0')
          echo "KC roster players: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/stats?season=2024&position=QB&week=1
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/stats?season=2024&position=QB&week=1" \
            | jq '.total_records // 0')
          echo "QB week 1 records: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/00-0033873 — Mahomes
        run: |
          curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/00-0033873?season=2024" \
            | jq -e '.status == "success"'

      - name: GET /coaches/?years=2024
        run: |
          TOTAL=$(curl -sf --max-time 180 \
            "${{ vars.API_URL }}/coaches/?years=2024" \
            | jq '.total_coaches // 0')
          echo "Coaches 2024: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /coaches/Andy Reid/analysis?years=2024
        run: |
          curl -sf --max-time 180 \
            "${{ vars.API_URL }}/coaches/Andy%20Reid/analysis?years=2024" \
            | jq -e '.status == "success"'

      - name: GET /coaches/Andy Reid/grades?years=2024
        run: |
          curl -sf --max-time 180 \
            "${{ vars.API_URL }}/coaches/Andy%20Reid/grades?years=2024" \
            | jq -e '.status == "success"'

      - name: GET /dashboard/ — frontend loads
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/dashboard/" \
            | grep -q '<div id="root">'

      - name: POST /chat/ — endpoint reachable (200 or 503 accepted)
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 \
            -X POST "${{ vars.API_URL }}/chat/" \
            -H "Content-Type: application/json" \
            -d '{"message":"ping","history":[]}')
          echo "Chat endpoint: $HTTP"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "503" ]
