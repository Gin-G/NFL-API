# Runs tests, builds and pushes a container image for FastAPI, and updates the
# Helm chart. ArgoCD auto-sync (always enabled) picks up the Helm change and
# rolls out the new image; this workflow no longer calls the ArgoCD API
# directly. Finally it smoke-tests the live endpoints.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME   - DockerHub login
#   DOCKERHUB_TOKEN      - DockerHub access token
#
# The live API URL comes from the API_URL repo variable (https://nfl-api.nickknows.net).

name: NFL API CI/CD

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - frontend/**
      - .github/workflows/**
  workflow_dispatch:

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: app
        run: pip install --quiet -r requirements.txt

      - name: Run tests
        working-directory: app
        run: python -m pytest tests/ -v --tb=short

  # ── 2. Build, push image, update Helm, deploy ─────────────────────────────
  build-and-deploy:
    name: Build, Push & Deploy
    needs: test
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.push_helm.outputs.sha }}
    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build and push NFL API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ncging/nfl-api:latest
            ncging/nfl-api:${{ steps.date.outputs.date }}

      - name: Update Helm chart with new image
        run: |
          sed -i "s|image: docker.io/ncging/nfl-api:.*|image: docker.io/ncging/nfl-api:${{ steps.date.outputs.date }}|" \
            helm/nfl-api/values.yaml

      - name: Push Helm chart changes to GitHub
        id: push_helm
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"
          git commit -a -m "ci: update image to ncging/nfl-api:${{ steps.date.outputs.date }}"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT


  # ── 4. Smoke-test every live endpoint ──────────────────────────────────────
  # This job intentionally references NO secrets. Because each GitHub-hosted job
  # runs on a fresh runner that only receives secrets explicitly used in that job,
  # ARGOCD_APP_NAME ("nfl-api") is never registered for masking here — so
  # ${{ vars.API_URL }} (https://nfl-api.nickknows.net) is never redacted.
  smoke-test:
    name: Smoke-Test Live API
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API to be fully ready
        run: |
          echo "curl: $(curl --version | head -1)"
          echo "Polling ${{ vars.API_URL }}/ until status == running (max 60 s)..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf --max-time 10 "${{ vars.API_URL }}/" 2>/dev/null \
              | jq -r '.status' 2>/dev/null || echo "")
            if [ "$STATUS" = "running" ]; then
              echo "API is ready (attempt $i)"
              exit 0
            fi
            echo "  [$i/12] status='$STATUS' — retrying in 5 s..."
            sleep 5
          done
          echo "ERROR: API did not return status=running within 60 s"
          curl -v --max-time 10 "${{ vars.API_URL }}/" || true
          exit 1

      - name: GET / — root
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/" \
            | jq -e '.status == "running"'

      - name: GET /health
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/health" \
            | jq -e '.status == "healthy"'

      - name: GET /teams/ — list
        run: |
          TOTAL=$(curl -sf --max-time 30 "${{ vars.API_URL }}/teams/" \
            | jq '.total_teams // 0')
          echo "Total teams: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /teams/KC — detail
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/teams/KC" \
            | jq -e '.data.team_abbr == "KC"'

      - name: GET /schedules/?season=2024&week=1
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/schedules/?season=2024&week=1" \
            | jq '.total_games // 0')
          echo "Games (2024 wk 1): $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/rosters?season=2024&team=KC
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/rosters?season=2024&team=KC" \
            | jq '.total_players // 0')
          echo "KC roster players: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/stats?season=2024&position=QB&week=1
        run: |
          TOTAL=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/stats?season=2024&position=QB&week=1" \
            | jq '.total_records // 0')
          echo "QB week 1 records: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]

      - name: GET /players/00-0033873 — Mahomes
        run: |
          curl -sf --max-time 60 \
            "${{ vars.API_URL }}/players/00-0033873?season=2024" \
            | jq -e '.status == "success"'

      - name: GET /coaches/?years=2024 — list + is_active split
        run: |
          BODY=$(curl -sf --max-time 180 "${{ vars.API_URL }}/coaches/?years=2024")
          TOTAL=$(echo "$BODY" | jq '.total_coaches // 0')
          echo "Coaches 2024: $TOTAL"
          [ "${TOTAL:-0}" -gt 0 ]
          echo "$BODY" | jq -e '[.data[] | has("is_active")] | all'
          ACTIVE=$(echo "$BODY" | jq '[.data[] | select(.is_active == true)] | length')
          echo "Active coaches: $ACTIVE"
          [ "${ACTIVE:-0}" -gt 0 ]

      - name: GET /coaches/Andy Reid/analysis?years=2024
        run: |
          curl -sf --max-time 180 \
            "${{ vars.API_URL }}/coaches/Andy%20Reid/analysis?years=2024" \
            | jq -e '.status == "success"'

      - name: GET /coaches/Andy Reid/grades?years=2024
        run: |
          curl -sf --max-time 180 \
            "${{ vars.API_URL }}/coaches/Andy%20Reid/grades?years=2024" \
            | jq -e '.status == "success"'

      - name: GET /coaches/Andy Reid/breakdown?season=2024
        run: |
          # Breakdown is served from the coach_season_analytics cache (pre-computed
          # by the standalone analytics job). Accepts either:
          #   status=success  — data cached and returned
          #   status=computing — analytics job is running; data will be cached soon
          # Both are passing states for CI; a real-time computation failure is an error.
          BODY=$(curl -sf --max-time 60 \
            "${{ vars.API_URL }}/coaches/Andy%20Reid/breakdown?season=2024" || echo "{}")
          STATUS=$(echo "$BODY" | jq -r '.status // "error"')
          echo "Breakdown status: $STATUS"
          if [ "$STATUS" = "success" ]; then
            ENTRIES=$(echo "$BODY" | jq '.data | length // 0' 2>/dev/null || echo 0)
            echo "Cached entries: $ENTRIES"
            [ "${ENTRIES:-0}" -gt 0 ] && echo "Breakdown OK (cached)" && exit 0
            echo "ERROR: status=success but no data entries"
            exit 1
          fi
          if [ "$STATUS" = "computing" ]; then
            PCT=$(echo "$BODY" | jq -r '.pct_complete // "?"')
            SEASON=$(echo "$BODY" | jq -r '.current_season // "?"')
            echo "Analytics job in progress — ${PCT}% complete, processing season ${SEASON}"
            echo "Breakdown OK (computing)"
            exit 0
          fi
          echo "ERROR: unexpected breakdown status: $STATUS"
          echo "$BODY" | jq .
          exit 1

      - name: GET /dashboard/ — frontend loads
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/dashboard/" \
            | grep -q '<div id="root">'

      - name: GET /players/analytics/status — endpoint reachable
        run: |
          STATUS=$(curl -sf --max-time 30 "${{ vars.API_URL }}/players/analytics/status" \
            | jq -r '.status // "error"')
          echo "Player analytics status: $STATUS"
          # Any status except a 500 error is acceptable (no_job if job hasn't run yet)
          [ "$STATUS" != "error" ]

      - name: GET /players/00-0033873/breakdown?season=2024 — Mahomes breakdown
        run: |
          BODY=$(curl -sf --max-time 30 \
            "${{ vars.API_URL }}/players/00-0033873/breakdown?season=2024" || echo "{}")
          STATUS=$(echo "$BODY" | jq -r '.status // "error"')
          echo "Mahomes breakdown: $STATUS"
          # success if cached, computing if job running, no_data if job hasn't run yet
          [ "$STATUS" = "success" ] || [ "$STATUS" = "computing" ] || [ "$STATUS" = "no_data" ]

      - name: POST /chat/ — endpoint reachable (200 or 503 accepted)
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 \
            -X POST "${{ vars.API_URL }}/chat/" \
            -H "Content-Type: application/json" \
            -d '{"message":"ping","history":[]}')
          echo "Chat endpoint: $HTTP"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "503" ]
